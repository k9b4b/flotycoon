# Liczy realne trasy między miastami gry (GraphHopper + OpenStreetMap)
# i zapisuje src/data/routes.json z powrotem do repozytorium.
# Uruchom: zakładka Actions → „Trasy (GraphHopper)” → Run workflow (działa też z telefonu).
name: Trasy (GraphHopper)

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region z Geofabrik (np. europe/poland)'
        required: true
        default: 'europe/poland'

permissions:
  contents: write

env:
  GH_VERSION: '10.0'
  # Ostatnie linie logu jako adnotacja (widoczna w podsumowaniu przebiegu i przez API).
  ANNOTATE_LOG: tail -n 40 data/gh.log | cut -c1-300 | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}'

jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Zależności
        run: npm install --no-audit --no-fund

      - name: Bieżący tydzień
        id: week
        run: echo "week=$(date +%G-%V)" >> "$GITHUB_OUTPUT"

      - name: Cache danych OSM i GraphHoppera
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: |
            data/graphhopper.jar
            data/region.osm.pbf
          # Nowe dane raz w tygodniu; ponowne uruchomienia w tym samym tygodniu nie pobierają 2 GB od nowa.
          key: osm-${{ inputs.region }}-gh${{ env.GH_VERSION }}-${{ steps.week.outputs.week }}

      - name: Pobierz GraphHoppera i dane OSM
        run: |
          mkdir -p data
          [ -f data/graphhopper.jar ] || curl -fsSL -o data/graphhopper.jar "https://github.com/graphhopper/graphhopper/releases/download/${GH_VERSION}/graphhopper-web-${GH_VERSION}.jar"
          [ -f data/region.osm.pbf ] || curl -fL -o data/region.osm.pbf "https://download.geofabrik.de/${{ inputs.region }}-latest.osm.pbf"
          ls -lh data

      # Zapis cache od razu po pobraniu, żeby przetrwał nawet nieudany przebieg.
      - name: Zapisz cache danych
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/graphhopper.jar
            data/region.osm.pbf
          key: osm-${{ inputs.region }}-gh${{ env.GH_VERSION }}-${{ steps.week.outputs.week }}

      - name: Import grafu i start serwera
        run: |
          java -Xmx10g -jar data/graphhopper.jar server tools/routes/config.yml > data/gh.log 2>&1 &
          PID=$!
          for i in $(seq 1 360); do
            if curl -sf http://localhost:8989/health > /dev/null; then echo "Serwer gotowy po $((i * 10)) s"; exit 0; fi
            if ! kill -0 $PID 2>/dev/null; then echo "::error title=GraphHopper padł::$(eval "$ANNOTATE_LOG")"; exit 1; fi
            if [ $((i % 60)) -eq 0 ]; then echo "::notice title=Import $((i / 6)) min::$(tail -n 1 data/gh.log | cut -c1-250)"; fi
            sleep 10
          done
          echo "::error title=GraphHopper nie wystartował w 60 min::$(eval "$ANNOTATE_LOG")"; exit 1

      - name: Policz trasy
        run: set +e; node tools/routes/build-routes.ts 2>&1 | tee data/routes.log; test ${PIPESTATUS[0]} -eq 0 || { echo "::error title=Liczenie tras::$(tail -n 30 data/routes.log | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')"; exit 1; }

      - name: Log GraphHoppera (przy błędzie)
        if: failure()
        run: echo "::error title=Log GraphHoppera::$(eval "$ANNOTATE_LOG")" || true

      - name: Zapisz wynik w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add src/data/routes.json
          if git diff --cached --quiet; then echo "Bez zmian"; exit 0; fi
          git commit -m "Trasy: ${{ inputs.region }} (GraphHopper ${GH_VERSION})"
          git push

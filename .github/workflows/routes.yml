# Liczy realne trasy między miastami gry (GraphHopper + OpenStreetMap)
# i zapisuje src/data/routes.json z powrotem do repozytorium.
# Uruchom: zakładka Actions → „Trasy (GraphHopper)” → Run workflow (działa też z telefonu).
name: Trasy (GraphHopper)

on:
  workflow_dispatch:
    inputs:
      region:
        description: 'Region z Geofabrik (np. europe/poland)'
        required: true
        default: 'europe/poland'

permissions:
  contents: write

env:
  GH_VERSION: '10.0'

jobs:
  routes:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Zależności
        run: npm install --no-audit --no-fund

      - name: Pobierz GraphHoppera i dane OSM
        run: |
          mkdir -p data
          curl -fsSL -o data/graphhopper.jar "https://github.com/graphhopper/graphhopper/releases/download/${GH_VERSION}/graphhopper-web-${GH_VERSION}.jar"
          curl -fL -o data/region.osm.pbf "https://download.geofabrik.de/${{ inputs.region }}-latest.osm.pbf"
          ls -lh data

      - name: Import grafu i start serwera
        run: |
          java -Xmx10g -jar data/graphhopper.jar server tools/routes/config.yml > data/gh.log 2>&1 &
          PID=$!
          for i in $(seq 1 360); do
            if curl -sf http://localhost:8989/health > /dev/null; then echo "Serwer gotowy po $((i * 10)) s"; exit 0; fi
            if ! kill -0 $PID 2>/dev/null; then echo "GraphHopper zakończył się błędem:"; tail -n 80 data/gh.log; exit 1; fi
            if [ $((i % 6)) -eq 0 ]; then echo "[$((i / 6)) min] $(tail -n 1 data/gh.log | cut -c1-200)"; fi
            sleep 10
          done
          echo "GraphHopper nie wystartował w 60 min"; tail -n 80 data/gh.log; exit 1

      - name: Policz trasy
        run: npx tsx tools/routes/build-routes.ts

      - name: Log GraphHoppera (przy błędzie)
        if: failure()
        run: tail -n 120 data/gh.log || true

      - name: Zapisz wynik w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898699+github-actions[bot]@users.noreply.github.com"
          git add src/data/routes.json
          if git diff --cached --quiet; then echo "Bez zmian"; exit 0; fi
          git commit -m "Trasy: ${{ inputs.region }} (GraphHopper ${GH_VERSION})"
          git push
